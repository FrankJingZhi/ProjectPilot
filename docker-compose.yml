services:
  postgres:
    image: postgres:16-alpine
    container_name: projectpilot-postgres
    environment:
      POSTGRES_USER: projectpilot
      POSTGRES_PASSWORD: projectpilot
      POSTGRES_DB: projectpilot
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U projectpilot -d projectpilot']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
